{{- /* NET-WU-09: dashboard egress. The dashboard BFF reaches the policy-manager
       for the decisions/management API + SSE stream (:8080) and its metrics
       (:9091), and scrapes the admission-webhook metrics (:9090). Gated on
       dashboard.enabled; each `to` peer is only emitted when its target component
       is enabled so the egress points at something real. */ -}}
{{- if and .Values.networkPolicy.enabled .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-policies.fullname" . }}-egress-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  podSelector:
    matchLabels:
      {{- include "kube-policies.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  policyTypes:
    - Egress
  egress:
    {{- if .Values.policyManager.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "kube-policies.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: policy-manager
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9091
    {{- end }}
    {{- if .Values.admissionWebhook.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "kube-policies.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: admission-webhook
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
{{- end }}
