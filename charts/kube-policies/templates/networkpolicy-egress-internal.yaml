{{- /* NET-WU-08: internal egress from admission-webhook pods to policy-manager
       pods on :8080 (the decisions channel /api/v1/decisions/internal). Pairs with
       the policy-manager ingress allow (NET-WU-05). Gated on both components being
       enabled so the egress target actually exists. */ -}}
{{- if and .Values.networkPolicy.enabled .Values.admissionWebhook.enabled .Values.policyManager.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-policies.fullname" . }}-egress-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
spec:
  podSelector:
    matchLabels:
      {{- include "kube-policies.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admission-webhook
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "kube-policies.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: policy-manager
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
