{{- if and (or .Values.admissionWebhook.enabled .Values.policyManager.enabled .Values.dashboard.enabled) .Values.certManager.enabled (ne .Values.certManager.issuerType "existing") }}
{{- /*
  Shared cert-manager issuing CA for webhook, policy-manager, AND dashboard TLS
  (CRY-WU-09/07/08). All component Certificates reference the issuer
  <fullname>-webhook-issuer, so their leaf certs chain to ONE shared CA and the
  ca.crt written into every serving Secret is identical. This is what lets a
  client that trusts a single mounted ca.crt verify ALL three services'
  certs (e.g. the dashboard scraping the webhook /metrics with only the
  policy-manager CA mounted, CRY-WU-08).

  issuerType:
    selfsigned (default) — bootstrap a self-signed ROOT CA and issue from it via
      a CA issuer. A bare selfSigned issuer would NOT share a CA: it signs each
      leaf with its own freshly generated key, so leaves would not chain to a
      common ca.crt. The root-CA bootstrap is the standard cert-manager pattern
      for a shared in-cluster CA.
    ca — issue from an operator-provided CA Secret (already a shared CA).
    existing — operator supplies issuerRef; nothing is rendered here.
*/ -}}
{{- if eq .Values.certManager.issuerType "ca" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-policies.fullname" . }}-webhook-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ required "certManager.caSecretName is required when certManager.issuerType=ca" .Values.certManager.caSecretName }}
{{- else }}
# 1. Bootstrap self-signed issuer (signs only the root CA below).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-policies.fullname" . }}-selfsigned-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# 2. Self-signed ROOT CA certificate. Longer-lived than the leaves so root
#    rotation (which would invalidate every leaf) is rare.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kube-policies.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "kube-policies.fullname" . }}-ca
  secretName: {{ include "kube-policies.fullname" . }}-ca
  duration: 43800h0m0s    # 5 years
  renewBefore: 720h0m0s   # 30 days
  privateKey:
    algorithm: {{ .Values.certManager.privateKey.algorithm }}
    size: {{ .Values.certManager.privateKey.size }}
    rotationPolicy: {{ .Values.certManager.privateKey.rotationPolicy | default "Always" }}
  issuerRef:
    name: {{ include "kube-policies.fullname" . }}-selfsigned-bootstrap
    kind: Issuer
    group: cert-manager.io
---
# 3. Shared CA issuer that signs all leaf serving certs from the root above.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-policies.fullname" . }}-webhook-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "kube-policies.fullname" . }}-ca
{{- end }}
{{- end }}
