{{- if and (or .Values.admissionWebhook.enabled .Values.policyManager.enabled .Values.dashboard.enabled) .Values.certManager.enabled (ne .Values.certManager.issuerType "existing") }}
{{- /*
  Shared cert-manager Issuer for webhook, policy-manager, AND dashboard TLS
  (CRY-WU-09/07). Rendered when certManager.enabled=true, issuerType is
  selfsigned or ca, and at least one component that consumes it is enabled — so
  no component's Certificate issuerRef (policy-manager-tls.yaml /
  dashboard-tls.yaml) dangles when another component is disabled. When
  issuerType=existing the operator supplies certManager.issuerRef and no Issuer
  is rendered here.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-policies.fullname" . }}-webhook-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
spec:
{{- if eq .Values.certManager.issuerType "ca" }}
  ca:
    secretName: {{ required "certManager.caSecretName is required when certManager.issuerType=ca" .Values.certManager.caSecretName }}
{{- else }}
  selfSigned: {}
{{- end }}
{{- end }}
