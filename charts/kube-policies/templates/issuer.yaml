{{- if and (or .Values.admissionWebhook.enabled .Values.policyManager.enabled) .Values.certManager.enabled (ne .Values.certManager.issuerType "existing") }}
{{- /*
  Shared cert-manager Issuer for webhook AND policy-manager TLS (CRY-WU-09).
  Rendered when certManager.enabled=true, issuerType is selfsigned or ca, and at
  least one component that consumes it is enabled — so the policy-manager
  Certificate's issuerRef (policy-manager-tls.yaml) never dangles when the
  webhook is disabled. When issuerType=existing the operator supplies
  certManager.issuerRef and no Issuer is rendered here.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-policies.fullname" . }}-webhook-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
spec:
{{- if eq .Values.certManager.issuerType "ca" }}
  ca:
    secretName: {{ required "certManager.caSecretName is required when certManager.issuerType=ca" .Values.certManager.caSecretName }}
{{- else }}
  selfSigned: {}
{{- end }}
{{- end }}
