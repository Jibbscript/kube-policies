{{- if .Values.rbac.create }}
{{- if .Values.rbac.serviceAccount.create }}
# Admission-webhook ServiceAccount (IAM-WU-09): the enforcement plane's identity.
# automountServiceAccountToken: false (IAM-WU-10, CIS 5.1.5/5.1.6) — the SA default
# is off; the webhook Deployment opts the token back IN at pod level because the
# controller-runtime client + leader election need it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-policies.webhookServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
  {{- with .Values.rbac.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# Policy-manager ServiceAccount (IAM-WU-09): the management plane's identity,
# distinct from the webhook for separation of duties (NIST AC-5).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-policies.policyManagerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
  {{- with .Values.rbac.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
# Least-privilege ClusterRole for the admission-webhook (IAM-WU-08). The reconcilers
# watch policies/policyexceptions across all namespaces (Namespaced CRDs, cluster-wide
# watch) and patch their /status; nothing else in the apiserver is read or written at
# runtime. No core/apps/rbac/networking/admissionregistration grants — the webhook does
# NOT self-register webhook configs and the engine does not fetch related cluster
# objects during evaluation (TLS certs are volume-mounted, not API-fetched).
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  name: {{ include "kube-policies.fullname" . }}-admission-webhook
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
rules:
# Policy resources
- apiGroups: ["policies.kube-policies.io"]
  resources:
  - policies
  - policyexceptions
  verbs: ["get", "list", "watch"]

# Policy status subresources.
# PolicyReconciler.publishPolicyStatus / PolicyExceptionReconciler.publishExceptionStatus
# write phase + conditions via r.Status().Patch(), which targets the
# /<plural>/<name>/status endpoint. The apiserver enforces RBAC on the
# subresource separately from the parent — without this rule the patch is
# rejected with "cannot patch resource \"policies/status\"" and the e2e
# spec polling for phase=Active times out at 30s.
- apiGroups: ["policies.kube-policies.io"]
  resources:
  - policies/status
  - policyexceptions/status
  verbs: ["get", "update", "patch"]
---
# Separate ClusterRole for the policy-manager (IAM-WU-08), distinct object for
# separation of duties even though the rule set matches the webhook's: both planes
# reconcile the same CRDs with the same minimal apiserver footprint.
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  name: {{ include "kube-policies.fullname" . }}-policy-manager
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
rules:
# Policy resources
- apiGroups: ["policies.kube-policies.io"]
  resources:
  - policies
  - policyexceptions
  verbs: ["get", "list", "watch"]

# Policy status subresources (see the webhook ClusterRole above for why the
# /status subresource needs its own rule).
- apiGroups: ["policies.kube-policies.io"]
  resources:
  - policies/status
  - policyexceptions/status
  verbs: ["get", "update", "patch"]
{{- if eq (include "kube-policies.internalAuthMode" .) "tokenreview" }}
# TokenReview validation for the inbound webhook decisions channel (IAM-WU-11).
# TokenReview is a write-only (create), cluster-scoped subresource of the
# authentication.k8s.io API: the apiserver evaluates the submitted token and
# returns the verdict in the response body — nothing is persisted, so only
# "create" is needed (no get/list/watch). Granted ONLY to the policy-manager and
# ONLY in tokenreview mode.
- apiGroups: ["authentication.k8s.io"]
  resources:
  - tokenreviews
  verbs: ["create"]
{{- end }}
---
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-policies.fullname" . }}-admission-webhook
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-policies.fullname" . }}-admission-webhook
subjects:
- kind: ServiceAccount
  name: {{ include "kube-policies.webhookServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-policies.fullname" . }}-policy-manager
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-policies.fullname" . }}-policy-manager
subjects:
- kind: ServiceAccount
  name: {{ include "kube-policies.policyManagerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader-election Role (IAM-WU-08, namespaced). The coordination.k8s.io/Lease is
# created only in {{ .Release.Namespace }}, so the grant is a namespaced Role rather
# than a ClusterRole. Distinct lease IDs (kube-policies-admission-webhook vs
# kube-policies-policy-manager) mean each plane elects its own leader.
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: Role
metadata:
  name: {{ include "kube-policies.fullname" . }}-admission-webhook-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
rules:
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# controller-runtime leader election emits a namespaced "became leader" Event through
# the client-go EventRecorder (resourcelock.RecordEvent) — a call inside the library,
# not project code. Without this the apiserver Forbids the Event (a stray klog warning,
# not a crashloop) and the leadership-change audit breadcrumb is lost. Namespaced, not
# the cluster-wide events grant the old shared ClusterRole carried (IAM-WU-08).
- apiGroups: [""]
  resources:
  - events
  verbs: ["create", "patch"]
---
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: Role
metadata:
  name: {{ include "kube-policies.fullname" . }}-policy-manager-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
rules:
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# controller-runtime leader election emits a namespaced "became leader" Event through
# the client-go EventRecorder (resourcelock.RecordEvent) — a call inside the library,
# not project code. Without this the apiserver Forbids the Event (a stray klog warning,
# not a crashloop) and the leadership-change audit breadcrumb is lost. Namespaced, not
# the cluster-wide events grant the old shared ClusterRole carried (IAM-WU-08).
- apiGroups: [""]
  resources:
  - events
  verbs: ["create", "patch"]
---
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: RoleBinding
metadata:
  name: {{ include "kube-policies.fullname" . }}-admission-webhook-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-policies.fullname" . }}-admission-webhook-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "kube-policies.webhookServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: {{ include "kube-policies.rbac.apiVersion" . }}
kind: RoleBinding
metadata:
  name: {{ include "kube-policies.fullname" . }}-policy-manager-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-policies.fullname" . }}-policy-manager-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "kube-policies.policyManagerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
# NOTE: no monitoring ClusterRole here. The previous {{ "{{" }} monitoring.enabled {{ "}}" }}
# block granted cluster-wide read on nodes/pods/services/endpoints bound to the app
# SA but had no consumer (no ServiceMonitor/Prometheus template ships with this
# chart). A real Prometheus deployment ships its own RBAC; kube-policies does not
# need to grant it on the operator's behalf.
{{- end }}
