{{- /* NET-WU-05: policy-manager ingress on :8080 (the decisions/management HTTP
       API) ONLY from the admission-webhook and dashboard pods in this namespace.
       Two podSelector `from` peers, each matching the shared selectorLabels plus
       the per-component label. Gated on networkPolicy.enabled. */ -}}
{{- if and .Values.networkPolicy.enabled .Values.policyManager.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-policies.fullname" . }}-ingress-policy-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
spec:
  podSelector:
    matchLabels:
      {{- include "kube-policies.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: policy-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kube-policies.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: admission-webhook
        - podSelector:
            matchLabels:
              {{- include "kube-policies.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: dashboard
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
