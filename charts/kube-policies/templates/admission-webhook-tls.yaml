{{- if .Values.admissionWebhook.enabled -}}
{{- /* Fail-closed guard for apiserver mutual-TLS enforcement (IAM-WU-06). When
       admissionWebhook.tls.requireClientCert=true the webhook requires + verifies
       the apiserver client certificate, which is impossible without a client-CA
       bundle to verify against — the binary fails closed at startup. Refuse to
       render rather than ship a crash-looping deployment. Evaluated regardless of
       certManager state. Mirrors the auth.enabled / metrics.tls render-fail
       guards. */ -}}
{{- if and .Values.admissionWebhook.tls.requireClientCert (empty .Values.admissionWebhook.tls.clientCA) -}}
{{- fail "admissionWebhook.tls.requireClientCert=true requires admissionWebhook.tls.clientCA (the apiserver client-CA bundle)" -}}
{{- end -}}
{{- if not .Values.certManager.enabled -}}
{{- /* cert-manager DISABLED (default): chart provisions the serving cert and an
       inline caBundle via the 3-branch logic below. When certManager.enabled=true
       this whole block is skipped — cert-manager owns the Secret and ca-injector
       populates the caBundle (see the else branch). */ -}}
{{- $secretName := printf "%s-admission-webhook-certs" (include "kube-policies.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $tlsCrt := "" -}}
{{- $tlsKey := "" -}}
{{- $caBundle := "" -}}

{{- /* Three-branch render order (per A1/C2):
       1. lookup-preserve: existing Secret takes precedence (upgrade idempotence,
          preserves cert-manager-provided material, RBAC-blocked-lookup degrades to fresh-gen).
       2. inline-pem: operator-supplied tls.caCert/tls.cert/tls.key (autoGenerate=false path).
       3. gen-certs: chart-generated self-signed CA + leaf when autoGenerate=true.
       The single-file scope is REQUIRED — Helm lookup queries the live API server at
       render time, NOT the current release's pending manifests, so a separate Secret
       template + VWHC template + cross-template lookup would render caBundle="" on
       first install. */ -}}

{{- if and $existingSecret $existingSecret.data -}}
  {{- $tlsCrt = index $existingSecret.data "tls.crt" | default "" -}}
  {{- $tlsKey = index $existingSecret.data "tls.key" | default "" -}}
  {{- $caBundle = index $existingSecret.data "ca.crt" | default "" -}}
{{- else if and (not .Values.admissionWebhook.tls.autoGenerate) .Values.admissionWebhook.tls.caCert .Values.admissionWebhook.tls.cert .Values.admissionWebhook.tls.key -}}
  {{- $tlsCrt = .Values.admissionWebhook.tls.cert | b64enc -}}
  {{- $tlsKey = .Values.admissionWebhook.tls.key | b64enc -}}
  {{- $caBundle = .Values.admissionWebhook.tls.caCert | b64enc -}}
{{- else if .Values.admissionWebhook.tls.autoGenerate -}}
  {{- /* DEMO-ONLY (CRY-WU-11): sprig genCA/genSignedCert emit a FIXED RSA-2048 /
         SHA-256 key pair with no algorithm/size knob, which is below the
         FedRAMP-Moderate bar. Production must use cert-manager
         (certManager.enabled=true → ECDSA P-256) or supply an approved-strength
         cert via tls.caCert/cert/key. See docs/compliance/crypto-standards.md. */ -}}
  {{- $svc := printf "%s-admission-webhook" (include "kube-policies.fullname" .) -}}
  {{- $ns := .Release.Namespace -}}
  {{- /* Per A2/C3 — five DNS names + one IP, matching scripts/gen-webhook-cert.sh:53-58 verbatim. */ -}}
  {{- $altNames := list
       $svc
       (printf "%s.%s" $svc $ns)
       (printf "%s.%s.svc" $svc $ns)
       (printf "%s.%s.svc.cluster.local" $svc $ns)
       "localhost"
  -}}
  {{- $ca := genCA "kube-policies-webhook-ca" 365 -}}
  {{- $cert := genSignedCert $svc (list "127.0.0.1") $altNames 365 $ca -}}
  {{- $tlsCrt = $cert.Cert | b64enc -}}
  {{- $tlsKey = $cert.Key | b64enc -}}
  {{- $caBundle = $ca.Cert | b64enc -}}
{{- else -}}
  {{- /* Render-time fail-fast: no existing Secret, no inline PEM, autoGenerate=false.
         The webhook would be installed with empty caBundle and reject all admissions. */ -}}
  {{- fail (printf "admissionWebhook.tls: no Secret %s exists, no inline tls.caCert/cert/key provided, and tls.autoGenerate=false. Set tls.autoGenerate=true, OR run scripts/gen-webhook-cert.sh before helm install, OR supply tls.caCert/cert/key inline." $secretName) -}}
{{- end -}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt | quote }}
  tls.key: {{ $tlsKey | quote }}
  ca.crt: {{ $caBundle | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kube-policies.fullname" . }}-validating-webhook
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
webhooks:
  - name: validate.kube-policies.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.admissionWebhook.webhook.failurePolicy | default "Fail" }}
    timeoutSeconds: {{ .Values.admissionWebhook.webhook.timeoutSeconds | default 10 }}
    clientConfig:
      service:
        name: {{ include "kube-policies.fullname" . }}-admission-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 8443
      caBundle: {{ $caBundle | quote }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - local-path-storage
            - {{ .Release.Namespace }}
{{- else -}}
{{- /* cert-manager ENABLED (CRY-WU-09): no inline Secret and no inline
       caBundle. cert-manager issues the serving cert (see certificate.yaml /
       issuer.yaml) into the same Secret the deployment mounts, and the
       cert-manager.io/inject-ca-from annotation makes ca-injector populate the
       caBundle from the Certificate's resulting CA. The annotation value MUST be
       <namespace>/<certificate-name> (the Certificate is named
       <fullname>-admission-webhook), NOT the Secret name. */ -}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kube-policies.fullname" . }}-validating-webhook
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-admission-webhook" .Release.Namespace (include "kube-policies.fullname" .) | quote }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
webhooks:
  - name: validate.kube-policies.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.admissionWebhook.webhook.failurePolicy | default "Fail" }}
    timeoutSeconds: {{ .Values.admissionWebhook.webhook.timeoutSeconds | default 10 }}
    clientConfig:
      service:
        name: {{ include "kube-policies.fullname" . }}-admission-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 8443
      # caBundle intentionally omitted; cert-manager ca-injector populates it.
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - local-path-storage
            - {{ .Release.Namespace }}
{{- end }}
{{- end }}
