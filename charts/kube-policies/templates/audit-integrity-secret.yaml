{{- if and .Values.audit.enabled .Values.audit.integrity.enabled }}
{{- /*
  Audit-integrity HMAC key (AUD-WU-05, NIST AU-9 / SC-12). Mounted into the
  admission-webhook pod at audit.integrity.keyPath; the audit logger keys its
  tamper-evidence hash chain from it. Precedence: an existing Secret (upgrade
  idempotence / external rotation) > operator-supplied audit.integrity.key >
  a chart-generated DEMO key (template-time RNG — NOT a CSPRNG; production must
  supply audit.integrity.key or an external secret).
*/ -}}
{{- $secretName := printf "%s-audit-integrity" (include "kube-policies.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- if and $existing $existing.data $existing.data.key -}}
{{- $key = index $existing.data "key" | b64dec -}}
{{- else if .Values.audit.integrity.key -}}
{{- $key = .Values.audit.integrity.key -}}
{{- else -}}
{{- $key = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ $key | b64enc | quote }}
{{- end }}
