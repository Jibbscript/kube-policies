{{- if or .Values.admissionWebhook.enabled .Values.policyManager.enabled }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-internal-token" (include "kube-policies.fullname" .)) -}}
{{- $token := "" -}}
{{- /* Token precedence (CRY-WU-14): an existing Secret (upgrade idempotence /
       external rotation) > operator-supplied internalToken > a chart-generated
       DEMO token. PRODUCTION must supply internalToken from a FIPS-validated
       CSPRNG (e.g. `openssl rand -base64 48`, or auth.GenerateToken) — the
       randAlphaNum fallback below is sprig template-time RNG (NOT a CSPRNG) and
       is DEMO-ONLY. Rotate with no downtime via the two-token window in
       docs/runbooks/internal-token-rotation.md (POLICY_MANAGER_INTERNAL_TOKEN_PREVIOUS). */ -}}
{{- if and $existingSecret $existingSecret.data.token -}}
{{- $token = index $existingSecret.data "token" | b64dec -}}
{{- else if .Values.internalToken -}}
{{- $token = .Values.internalToken -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}{{- /* DEMO-ONLY: template-time RNG, not a CSPRNG. */ -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-policies.fullname" . }}-internal-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-policies.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
