# zap-baseline.conf — OWASP ZAP baseline rules configuration
# SDL-WU-26 / VUL-WU-16 | NIST CA-8, SA-11, RA-5(5)
#
# Format per zap-baseline.py -c <file>:
#   <rule-id>    IGNORE | WARN | FAIL
#
# Columns: rule-id  action  [optional comment]
#
# Philosophy:
#   FAIL  — real security issues that must block the build
#   WARN  — issues to track but not block (informational / tuning noise)
#   IGNORE — pure informational fingerprinting that produces no actionable finding
#            in a Kubernetes-internal service (no public exposure, no browser)
#
# Reference:
#   https://www.zaproxy.org/docs/docker/baseline-scan/
#   https://www.zaproxy.org/alertdetails/
# ──────────────────────────────────────────────────────────────────────────────

# ── FAIL: Real security findings that must break the build ────────────────────

# SQL Injection
40018   FAIL    # SQL Injection

# OS Command Injection
90020   FAIL    # Remote OS Command Injection

# Server Side Request Forgery
40046   FAIL    # SSRF

# Cross-Site Scripting (Reflected)
40012   FAIL    # Cross Site Scripting (Reflected)

# Cross-Site Scripting (Persistent)
40014   FAIL    # Cross Site Scripting (Persistent)

# External Redirect
20019   FAIL    # External Redirect

# Path Traversal
6       FAIL    # Path Traversal

# Remote File Inclusion
7       FAIL    # Remote File Inclusion

# Buffer Overflow
30001   FAIL    # Buffer Overflow

# Format String Error
30002   FAIL    # Format String Error

# Generic Padding Oracle
90024   FAIL    # Generic Padding Oracle

# HTTPS to HTTP Insecure Transition
10041   FAIL    # HTTP to HTTPS Insecure Transition in Form Post

# HTTP Strict Transport Security header missing on HTTPS response
10035   FAIL    # Strict-Transport-Security Header Not Set (on TLS endpoint)

# Viewstate without MAC
10032   FAIL    # Viewstate without MAC Signature (CSRF vector if applicable)

