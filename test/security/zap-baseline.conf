# Information Disclosure — suspicious comments
10027   WARN    # Information Disclosure — Suspicious Comments

# Information Disclosure — debug error messages
10023   WARN    # Information Disclosure — Debug Error Messages

# Timestamp disclosure
10096   WARN    # Timestamp Disclosure

# Modern Web Application risk (SPA framework hints)
10109   WARN    # Modern Web Application

# User Agent fuzzer findings (minor content-type variations)
10104   WARN    # User Agent Fuzzer

# Loosely scoped cookie
90033   WARN    # Loosely Scoped Cookie

# Absence of Anti-CSRF tokens (API endpoints use bearer tokens, not cookies)
20012   WARN    # Anti-CSRF Tokens Check

