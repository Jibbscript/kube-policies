apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-policies-admission-webhook
  namespace: default
  labels:
    helm.sh/chart: kube-policies-1.2.0
    app.kubernetes.io/name: kube-policies
    app.kubernetes.io/instance: kube-policies
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: admission-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-policies
      app.kubernetes.io/instance: kube-policies
      app.kubernetes.io/component: admission-webhook
  template:
    metadata:
      annotations:
        checksum/config: a5068f0a1f921f5bd9d0a0df4a42fb1925a2ef35103ad2edf7ffde2b6a190540
        # Lookup-based annotation per A-NEW-1 fix. Queries the live API for the cert
        # Secret bytes; deterministic per render. On first install the Secret doesn't
        # exist yet, so default to the literal "initial-install". On subsequent
        # upgrades, the lookup finds the Secret data and the annotation stabilizes
        # to sha256(data). On out-of-band Secret delete + upgrade, lookup returns
        # empty → annotation goes back to "initial-install" → differs from previous
        # stable hash → pod rolling restart picks up the freshly-generated cert.
        # One-time cost: an extra rolling restart immediately after first install
        # (lookup empty → stable hash transition). Operationally acceptable.
        checksum/webhook-certs: 74234e98afe7498fb5daf1f36ac2d78acc339464f950703b8c019892f982b90b
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: kube-policies
        app.kubernetes.io/instance: kube-policies
        app.kubernetes.io/component: admission-webhook
    spec:
      serviceAccountName: kube-policies-admission-webhook
      # IAM-WU-10 (CIS 5.1.5/5.1.6): the SA defaults automount off; the webhook opts
      # the token back in here because the controller-runtime client + leader election
      # authenticate to the apiserver with it.
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission-webhook
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          image: "docker.io/kube-policies/admission-webhook:1.0.0"
          imagePullPolicy: IfNotPresent
          # Probes target the metrics server (port 9090) where /healthz and
          # /readyz are mounted. The webhook TLS port (8443) cannot serve a
          # plain-HTTP probe, so containerPort `metrics` is the only safe
          # target for httpGet.
          args:
            - --port=8443
            - --metrics-port=9090
            - --cert-path=/etc/certs/tls.crt
            - --key-path=/etc/certs/tls.key
            - --config=/etc/config/config.yaml
            - --disable-default-policies=false
            # Apiserver mutual-TLS enforcement (IAM-WU-06). The render-fail guard
            # in admission-webhook-tls.yaml ensures requireClientCert=true is paired
            # with a clientCA bundle, so true never reaches a CA-less listener (the
            # binary would otherwise fail closed at startup). Dev default is false
            # (tracked gap); production sets true + clientCA.
            - --require-client-cert=false
            # Verify the policy-manager TLS cert on the decision-publisher
            # connection (CRY-WU-06): trust the policy-manager serving CA.
            - --policy-manager-ca-path=/etc/policy-manager-ca/ca.crt
            # Present an audience-bound, short-TTL projected ServiceAccount token
            # to the policy-manager decisions channel (IAM-WU-11). Gate on mode
            # only — not policyManager.enabled — so a split/webhook-only deploy
            # (PM external) still presents the credential (FIX 5).
            - --policy-manager-token-path=/var/run/secrets/kube-policies/pm-token/token
          ports:
            - name: webhook
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: GODEBUG
              value: "fips140=on"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLICY_MANAGER_INTERNAL_URL
              value: "https://kube-policies-policy-manager:8080/api/v1/decisions/internal"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              # HTTPS when /metrics serves TLS (CRY-WU-08); /healthz stays
              # token-exempt and the kubelet HTTPS probe skips cert verification.
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # /readyz is not registered on the admission-webhook metrics server
          # (see cmd/admission-webhook/main.go::setupMetricsServer). Probe the
          # /healthz endpoint that IS registered. Real readiness lives behind
          # the TLS webhook server; that requires TLS-aware probing which a
          # plain httpGet cannot do.
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
            - name: policy-manager-ca
              mountPath: /etc/policy-manager-ca
              readOnly: true
            # Projected SA token for the decisions channel (IAM-WU-11). Gate on
            # mode only (FIX 5) so a webhook-only / split deploy still mounts it.
            - name: pm-internal-token
              mountPath: /var/run/secrets/kube-policies/pm-token
              readOnly: true
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: audit-log
              mountPath: /var/log/kube-policies
      volumes:
        - name: certs
          secret:
            secretName: kube-policies-admission-webhook-certs
        # Project ONLY ca.crt (public) from the policy-manager serving Secret —
        # never its tls.key. optional: the cert-manager-managed Secret may not
        # exist yet on first install; the webhook degrades to system roots until
        # it appears (CRY-WU-06).
        - name: policy-manager-ca
          secret:
            secretName: kube-policies-policy-manager-certs
            items:
              - key: ca.crt
                path: ca.crt
            optional: true
        # Audience-bound, short-TTL projected ServiceAccount token for the
        # webhook -> policy-manager decisions channel (IAM-WU-11). Gated on mode
        # only (FIX 5) — a split/webhook-only deploy must still project the token.
        # The kubelet mints a token scoped to audience=<internalAuth.audience>
        # with the configured TTL and atomically swaps it as it rotates.
        - name: pm-internal-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "policy-manager"
                  expirationSeconds: 3600
        - name: config
          configMap:
            name: kube-policies-config
        - name: tmp
          emptyDir: {}
        # Writable mount for the audit file backend. readOnlyRootFilesystem
        # blocks mkdir at /var/log/kube-policies on the pod's overlay; this
        # emptyDir gives the audit logger a writable directory matching the
        # default filename. For persistence beyond pod lifetime, replace
        # with a PVC.
        - name: audit-log
          emptyDir: {}
