              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          image: "docker.io/kube-policies/policy-manager:1.0.0"
          imagePullPolicy: IfNotPresent
          # cmd/policy-manager/main.go reads only flags (not env vars). The
          # HTTP_PORT/METRICS_PORT env vars previously set here were ignored
          # by the binary, which silently caused a port mismatch (binary
          # listened on the flag defaults while the Service exposed the
          # env-var values). Use explicit args for clarity.
          args:
            - --port=8080
            - --metrics-port=9091
            - --config=/etc/config/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: GODEBUG
              value: "fips140=on"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Validate the inbound webhook token via the Kubernetes TokenReview
            # API, bound to this audience AND subject (IAM-WU-11). Subject pinning
            # ties acceptance to the webhook's specific SA identity, preventing any
            # other SA that happens to obtain the same audience token from passing
            # (AU-2/AU-3). The PM calls TokenReview with its already-automounted
            # apiserver SA token — no extra volume.
            - name: POLICY_MANAGER_INTERNAL_AUTH_MODE
              value: "tokenreview"
            - name: POLICY_MANAGER_INTERNAL_AUDIENCE
              value: "policy-manager"
            - name: POLICY_MANAGER_INTERNAL_SUBJECT
              value: "system:serviceaccount:default:kube-policies-admission-webhook"
            # Read side of the decisions plane (GET /stream + /recent): pin the
            # TokenReview to the DASHBOARD SA so the dashboard's upstream
            # subscriber authenticates to the read feeds without weakening the
            # webhook-SA pin on /internal (IAM-WU-11, Inc7 Stream A). Same audience
            # as POLICY_MANAGER_INTERNAL_AUDIENCE above.
            - name: POLICY_MANAGER_DECISIONS_READER_SUBJECT
              value: "system:serviceaccount:default:kube-policies-dashboard"
          # Probes target the plain-HTTP metrics port (9091) where /healthz and
          # /readyz are mounted (NewMetricsRouter). The :8080 API now serves
          # TLS (CRY-WU-05), so an HTTP probe against it would fail the
          # handshake — mirror the admission-webhook pattern and probe :9091.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
              # HTTPS when /metrics serves TLS (CRY-WU-08); /healthz + /readyz
              # stay token-exempt and the kubelet HTTPS probe skips cert verify.
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/kube-policies
      volumes:
        - name: certs
          secret:
            secretName: kube-policies-policy-manager-certs
        - name: config
          configMap:
            name: kube-policies-config
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: kube-policies-data
---
# Source: kube-policies/templates/admission-webhook-tls.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-policies-validating-webhook
  labels:
    helm.sh/chart: kube-policies-1.2.0
    app.kubernetes.io/name: kube-policies
    app.kubernetes.io/instance: kube-policies
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
webhooks:
  - name: validate.kube-policies.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: kube-policies-admission-webhook
        namespace: default
        path: /validate
        port: 8443
      caBundle: ""
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - local-path-storage
            - default
