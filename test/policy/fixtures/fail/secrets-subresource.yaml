# NEGATIVE fixture for rbac.leastprivilege LOW-1 (IAM-WU-17).
#
# Covers two evasion paths the original rule missed:
#   1. A Secrets subresource (secrets/status) — resource_is_secrets fires on
#      split(r,"/")[0]=="secrets".
#   2. The literal string "core" in apiGroups — some tools emit this instead of
#      the canonical empty-string core-group spelling.
#
# conftest MUST exit non-zero with a deny from package rbac.leastprivilege for
# each violating rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: regression-secrets-subresource
rules:
  - apiGroups: [""]
    resources: ["secrets/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["core"]
    resources: ["secrets"]
    verbs: ["get", "list"]
