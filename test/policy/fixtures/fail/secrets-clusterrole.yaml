# NEGATIVE fixture for rbac.leastprivilege (IAM-WU-17).
#
# A ClusterRole that reintroduces two least-privilege regressions:
#   1. cluster-wide read on core Secrets, and
#   2. a fully unrestricted */*/* wildcard rule.
#
# conftest MUST exit non-zero with a deny from package rbac.leastprivilege for
# each violating rule. If this fixture ever passes, the gate is broken.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: regression-secrets-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
