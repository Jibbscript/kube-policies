apiVersion: policies.kube-policies.io/v1
kind: Policy
metadata:
  name: security-baseline
  namespace: kube-policies-system
  labels:
    category: security
    severity: high
    compliance.framework: cis
    compliance.version: "1.8.0"
spec:
  description: "Basic security requirements for all workloads"
  enabled: true
  enforcement: true

  # Target resources
  match:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]

  # Namespace selector
  namespaceSelector:
    matchExpressions:
      - key: name
        operator: NotIn
        values: ["kube-system", "kube-public", "kube-node-lease"]

  # Policy rules — authored against the kube-policies engine contract:
  #   query:  data.kube_policies.evaluate
  #   input:  the K8s object lives at input.object.* (see internal/policy.prepareInput)
  #   output: {"allowed": bool} and, when allowed=false, also {"message": str, "path": str}
  #
  # Rules use OPA v1 syntax (`import rego.v1`). When multiple potential denials
  # match (e.g. several containers violate the same rule) each rule reports the
  # lowest-indexed violation deterministically so the engine receives exactly
  # one verdict per rule and no complete-doc conflict is raised.
  #
  # SHARED LIBRARY (POL-WU-01): every rule the engine compiles — bundled or
  # customer-authored — is compiled alongside data.kube_policies.lib
  # (internal/policy/rego/podspec.rego). Importing it lets a rule evaluate the
  # EFFECTIVE pod spec across workload controllers (Deployment/DaemonSet/
  # StatefulSet/Job/CronJob), initContainers, and ephemeralContainers instead of
  # only input.object.spec.containers. Helpers: lib.pod_spec, lib.all_containers,
  # lib.containers_with_paths (container + kind-correct JSONPath), lib.volumes,
  # lib.pod_security_context, lib.container_path_prefix.
  rules:
    # 1. No privileged containers
    - name: no-privileged-containers
      severity: HIGH
      description: "Containers must not run in privileged mode"
      frameworks: ["CIS-1.8.0", "NIST-800-53"]
      rego: |
        package kube_policies

        import rego.v1

        import data.kube_policies.lib as lib

        default evaluate := {"allowed": true}

        evaluate := {
          "allowed": false,
          "message": "Pod must not run in privileged mode",
          "path": sprintf("%s.securityContext.privileged", [lib.container_path_prefix]),
        } if {
          lib.pod_security_context.privileged == true
        }

        evaluate := {
          "allowed": false,
          "message": sprintf("Container '%s' must not run in privileged mode", [entry.container.name]),
          "path": sprintf("%s.securityContext.privileged", [entry.path]),
        } if {
          not pod_privileged
          indexes := [j |
            some j
            lib.containers_with_paths[j].container.securityContext.privileged == true
          ]
          count(indexes) > 0
          i := indexes[0]
          entry := lib.containers_with_paths[i]
        }

        pod_privileged if lib.pod_security_context.privileged == true

    # 2. No hostPath volumes
    - name: no-host-path-volumes
      severity: HIGH
      description: "hostPath volumes are not allowed"
      frameworks: ["CIS-1.8.0"]
      rego: |
        package kube_policies

        import rego.v1

        import data.kube_policies.lib as lib

        default evaluate := {"allowed": true}

        evaluate := {
          "allowed": false,
          "message": "hostPath volumes are not allowed",
          "path": sprintf("%s.volumes[%d].hostPath", [lib.container_path_prefix, i]),
        } if {
          indexes := [j |
            some j
            lib.volumes[j].hostPath
          ]
          count(indexes) > 0
          i := indexes[0]
        }

    # 3. No ":latest" (or implicit-latest) image tags
    - name: no-latest-image-tag
      severity: MEDIUM
      description: "Container images must not use ':latest' or an implicit latest tag"
      frameworks: ["CIS-1.8.0"]
      rego: |
        package kube_policies

        import rego.v1

        import data.kube_policies.lib as lib

        default evaluate := {"allowed": true}

        evaluate := {
          "allowed": false,
          "message": sprintf("Container image '%s' must specify an explicit non-':latest' tag", [entry.container.image]),
          "path": sprintf("%s.image", [entry.path]),
        } if {
          indexes := [j |
            some j
            bad_image(lib.containers_with_paths[j].container.image)
          ]
          count(indexes) > 0
          i := indexes[0]
          entry := lib.containers_with_paths[i]
        }

        bad_image(image) if endswith(image, ":latest")

        bad_image(image) if not contains(image, ":")

    # 4. Required securityContext (runAsNonRoot=true, allowPrivilegeEscalation!=true)
    - name: required-security-context
      severity: MEDIUM
      description: "Containers must declare a securityContext that runs as non-root and disallows privilege escalation"
      frameworks: ["CIS-1.8.0", "PSS-restricted"]
      rego: |
        package kube_policies

        import rego.v1

        import data.kube_policies.lib as lib

        default evaluate := {"allowed": true}

        evaluate := {
          "allowed": false,
          "message": sprintf("Container '%s' must declare runAsNonRoot=true and allowPrivilegeEscalation!=true in securityContext", [entry.container.name]),
          "path": sprintf("%s.securityContext", [entry.path]),
        } if {
          indexes := [j |
            some j
            missing_required_sc(lib.containers_with_paths[j].container)
          ]
          count(indexes) > 0
          i := indexes[0]
          entry := lib.containers_with_paths[i]
        }

        missing_required_sc(c) if not c.securityContext

        missing_required_sc(c) if not c.securityContext.runAsNonRoot

        missing_required_sc(c) if c.securityContext.runAsNonRoot == false

        missing_required_sc(c) if c.securityContext.allowPrivilegeEscalation == true

  # Exception handling
  exceptions:
    - name: system-namespaces
      description: "System namespaces are exempt from security policies"
      namespaces: ["kube-system", "kube-public", "kube-node-lease"]
      rules: ["*"]

    - name: privileged-workloads
      description: "Specific workloads that require privileged access"
      selector:
        matchLabels:
          security.policy/privileged: "true"
      rules: ["no-privileged-containers"]
      approval:
        required: true
        approvers: ["security-team"]
        duration: "30d"

  # Audit configuration
  audit:
    enabled: true
    level: "detailed"
    backends: ["file", "webhook"]

  # Metrics configuration
  metrics:
    enabled: true
    labels:
      policy: "security-baseline"
      category: "security"

# NOTE: The controls once deferred here (host-network/PID/IPC, run-as-root,
# resource limits) SHIPPED in P10 as first-class bundled rules on the current
# engine contract — see the pss-baseline (deny-host-namespaces), pss-restricted
# (require-run-as-nonroot), and nsa-hardening (require-resource-limits) packs in
# internal/policy/bundled_rules.go, the full catalog in docs/policy-library.md,
# and the enforcement profiles in docs/policy-profiles.md.
