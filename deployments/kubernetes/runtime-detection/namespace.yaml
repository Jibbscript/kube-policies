# Namespace for standalone Falco runtime-detection deployment.
# OPT-IN — apply only when you want Falco deployed outside the Helm chart path.
# If Falco is already installed cluster-wide in a different namespace (e.g.
# falco-system), skip this file and patch the DaemonSet namespace accordingly.
# NIST SI-4, SI-4(2), SI-4(4); IRM-WU-23.
apiVersion: v1
kind: Namespace
metadata:
  name: falco-system
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/component: runtime-detection
    app.kubernetes.io/managed-by: kustomize
    # pod-security.kubernetes.io/enforce is intentionally set to privileged:
    # Falco requires CAP_SYS_PTRACE + a kernel module (or eBPF) to inspect
    # syscalls. Do not apply a more restrictive policy to this namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
