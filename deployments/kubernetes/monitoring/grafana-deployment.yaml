# DEMO/Kind-grade Secret. This ships a placeholder admin credential so the
# stack starts out-of-the-box on Kind. The password ("admin") is NOT a
# secret and MUST NOT be used in production. For any real deployment, delete
# this manifest and provide the grafana-admin Secret out-of-band (e.g. sealed
# secret / external secret store), e.g.:
#   kubectl -n kube-policies-monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 24)"
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: kube-policies-monitoring
  labels:
    app: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kube-policies-monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # restricted-PSS pod securityContext. The grafana/grafana image runs as
      # the "grafana" user (UID/GID 472); fsGroup 472 lets it own the writable
      # emptyDir mounts. The root supplementalGroup (0) was removed — it is not
      # needed and violates restricted PSS.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          # SUP-WU-09 (CM-2/SI-7): pinned by immutable digest (tag kept for
          # readability). Demo-grade manifest; currency reviewed manually.
          image: grafana/grafana:9.3.0@sha256:659b34a5918d7ae6c2471e6141e03a985e508659bd58535263adf3170f7d15f8
          imagePullPolicy: IfNotPresent
          # restricted-PSS container securityContext. readOnlyRootFilesystem is
          # safe because Grafana's writable paths (/var/lib/grafana and /tmp)
          # are backed by emptyDir mounts below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-pv
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasources
              readOnly: false
            - mountPath: /etc/grafana/provisioning/dashboards
              name: grafana-dashboards-config
              readOnly: false
            - mountPath: /var/lib/grafana/dashboards/kube-policies
              name: grafana-dashboard-overview
              readOnly: false
            - mountPath: /tmp
              name: grafana-tmp
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-piechart-panel"
      volumes:
        # DEMO/Kind-grade storage only. Grafana's data dir and /tmp use
        # ephemeral emptyDir volumes — dashboards/state are lost on pod
        # restart. A production deployment must replace grafana-pv with a
        # PersistentVolumeClaim.
        - name: grafana-pv
          emptyDir: {}
        - name: grafana-tmp
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            defaultMode: 420
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            defaultMode: 420
            name: grafana-dashboards-config
        - name: grafana-dashboard-overview
          configMap:
            defaultMode: 420
            name: grafana-dashboard-overview
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kube-policies-monitoring
  labels:
    app: grafana
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: http-grafana
  selector:
    app: grafana
  sessionAffinity: None
  type: ClusterIP
