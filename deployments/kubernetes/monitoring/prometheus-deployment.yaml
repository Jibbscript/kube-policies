apiVersion: v1
kind: Namespace
metadata:
  name: kube-policies-monitoring
  labels:
    name: kube-policies-monitoring
    # CFG-WU-05/06 (CIS 5.2.1 / PSS-Restricted): enforce the restricted Pod
    # Security Standard on the monitoring namespace. The hardened Prometheus/
    # Grafana/Alertmanager workloads (CFG-WU-06/07/08) are admissible under it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kube-policies-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: kube-policies-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kube-policies-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'kube-policies-cluster'
        environment: 'production'

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      # Kube-Policies Admission Webhook
      # Default (demo): metrics is plain HTTP. When the chart is deployed with
      # metrics.tls.enabled=true (CRY-WU-08), /metrics serves TLS 1.3 and
      # requires a bearer token. Then add to BOTH jobs below (and mount the
      # serving CA + the <release>-internal-token Secret into this Prometheus
      # pod — cross-namespace, so copy the Secrets into this namespace):
      #     scheme: https
      #     tls_config:
      #       ca_file: /etc/prometheus/kp-tls/ca.crt
      #       # role:endpoints dials the pod IP, so pin the Service SAN:
      #       server_name: <job>.kube-policies-system.svc
      #     bearer_token_file: /etc/prometheus/kp-token/token
      # (Prefer ca_file over insecure_skip_verify.)
      - job_name: 'kube-policies-admission-webhook'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kube-policies-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-policies-admission-webhook
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics

      # Kube-Policies Policy Manager (see the admission-webhook job above for the
      # metrics.tls.enabled=true scrape shape; server_name becomes
      # kube-policies-policy-manager.kube-policies-system.svc).
      - job_name: 'kube-policies-policy-manager'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kube-policies-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-policies-policy-manager
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics

      # Kubernetes API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - default
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes Pods with annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # cAdvisor for container metrics
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: kube-policies-monitoring
# IRM-WU-14: alert rules are NO LONGER embedded here. They previously duplicated
# (and drifted from) the canonical rules. The SINGLE SOURCE OF TRUTH is
# charts/kube-policies/files/alerts/*.yaml (+ files/slo/*.yaml), rendered into
# the chart PrometheusRule and concatenated into
# monitoring/prometheus/rules/kube-policies.rules.yml by `make gen-monitoring-rules`.
# For this standalone (bring-your-own Prometheus) demo, regenerate and load the
# rules into THIS ConfigMap instead of hand-editing them here:
#
#   make gen-monitoring-rules
#   kubectl create configmap prometheus-rules -n kube-policies-monitoring \
#     --from-file=monitoring/prometheus/rules/kube-policies.rules.yml \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The empty placeholder below keeps the mount valid until you do so.
data:
  kube-policies.rules.yml: |
    groups: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kube-policies-monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # restricted-PSS pod securityContext. prom/prometheus runs as the
      # "nobody" user (UID/GID 65534) in its upstream image, so we pin to
      # that non-zero identity and let fsGroup own the writable emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        # SUP-WU-09 (CM-2/SI-7): pinned by immutable digest (tag kept for
        # readability). Raw monitoring manifests are demo-grade; image currency
        # is reviewed manually, not by Dependabot's docker ecosystem.
        image: prom/prometheus:v2.40.0@sha256:8e6e3cce35528e8411feaaa2602fee78dc29b30112dcebdf2099dd4d0df03ac1
        # restricted-PSS container securityContext. readOnlyRootFilesystem is
        # safe because every path Prometheus writes (TSDB + /tmp) is backed by
        # an emptyDir mount below.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=200h'
          # --web.enable-lifecycle exposes /-/reload and /-/quit. Kept minimal
          # (no admin API). Disable it too if you do not reload via HTTP.
          - '--web.enable-lifecycle'
          # NOTE: --web.enable-admin-api intentionally removed. It exposes
          # destructive TSDB endpoints (delete/clean tombstones) with no auth.
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/
        - name: prometheus-rules-volume
          mountPath: /etc/prometheus/rules/
        - name: prometheus-storage-volume
          mountPath: /prometheus/
        - name: tmp-volume
          mountPath: /tmp
        resources:
          requests:
            cpu: 200m
            memory: 1000Mi
          limits:
            cpu: 1000m
            memory: 2000Mi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          timeoutSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 30
          timeoutSeconds: 30
      volumes:
      - name: prometheus-config-volume
        configMap:
          defaultMode: 420
          name: prometheus-config
      - name: prometheus-rules-volume
        configMap:
          defaultMode: 420
          name: prometheus-rules
      # DEMO/Kind-grade storage only. The TSDB and /tmp use ephemeral emptyDir
      # volumes — data is lost on pod restart. A production deployment must
      # replace prometheus-storage-volume with a PersistentVolumeClaim.
      - name: prometheus-storage-volume
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kube-policies-monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: web
