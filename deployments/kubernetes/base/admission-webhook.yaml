apiVersion: v1
kind: Namespace
metadata:
  name: kube-policies-system
  labels:
    name: kube-policies-system
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-policies-admission-webhook
  namespace: kube-policies-system
  labels:
    app: kube-policies-admission-webhook
    component: admission-webhook
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: kube-policies-admission-webhook
  template:
    metadata:
      labels:
        app: kube-policies-admission-webhook
        component: admission-webhook
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kube-policies-admission-webhook
      # IAM-WU-10 (CIS 5.1.5/5.1.6): the SA defaults automount off; the webhook opts
      # the token back in here because the controller-runtime client + leader election
      # authenticate to the apiserver with it.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: kube-policies-admission-webhook
              topologyKey: kubernetes.io/hostname
      containers:
      - name: admission-webhook
        image: ghcr.io/enterprise/admission-webhook:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: webhook
          containerPort: 8443
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        args:
        - --cert-path=/etc/certs/tls.crt
        - --key-path=/etc/certs/tls.key
        - --port=8443
        - --metrics-port=9090
        - --config=/etc/config/config.yaml
        # IAM-WU-06: this base/example manifest runs the webhook WITHOUT
        # apiserver-client-cert verification (dev only; tracked gap). The binary
        # defaults --require-client-cert=true (fail closed); we explicitly set it
        # false here because this base ships no apiserver client-CA bundle and the
        # webhook would otherwise refuse to start. PRODUCTION uses the Helm chart
        # with admissionWebhook.tls.requireClientCert=true + a clientCA bundle.
        - --require-client-cert=false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Probes target the metrics server (port 9090) over plain HTTP. The
        # webhook TLS port (8443) cannot serve a plain-HTTP probe, and once
        # mutual TLS is enforced (client_auth=require + a client CA) an HTTPS
        # probe without a client cert would fail the handshake and kill the pod.
        # /healthz is registered on the metrics server; /readyz is not, so both
        # probes use /healthz (matches the Helm chart).
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: certs
        secret:
          secretName: kube-policies-webhook-certs
          defaultMode: 0400
      - name: config
        configMap:
          name: kube-policies-config
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: kube-policies-admission-webhook
  namespace: kube-policies-system
  labels:
    app: kube-policies-admission-webhook
    component: admission-webhook
spec:
  type: ClusterIP
  ports:
  - name: webhook
    port: 443
    targetPort: webhook
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: kube-policies-admission-webhook
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-policies-config
  namespace: kube-policies-system
  labels:
    app: kube-policies
    component: config
data:
  config.yaml: |
    server:
      port: 8443
      metrics_port: 9090
      log_level: info
      tls_cert_path: /etc/certs/tls.crt
      tls_key_path: /etc/certs/tls.key
    
    policy:
      failure_mode: "fail-closed"
      disable_defaults: false
    
    audit:
      enabled: true
      backend: "file"
      config:
        filename: "/var/log/kube-policies/audit.log"
      buffer_size: 1000
      flush_interval: "10s"
      retention: "90d"
    
    metrics:
      enabled: true
      namespace: "kube_policies"
      subsystem: "admission"
    
    security:
      tls:
        min_version: "1.3"
        cipher_suites:
          - "TLS_AES_256_GCM_SHA384"
          - "TLS_CHACHA20_POLY1305_SHA256"
          - "TLS_AES_128_GCM_SHA256"
        # client_auth is set to "none" here because this base/example manifest
        # does NOT mount an apiserver client-CA bundle (no client_ca_path volume
        # or Secret). Setting "require" without a CA bundle would be internally
        # inconsistent: BuildServerTLSConfig silently degrades to NoClientCert
        # when clientCAs==nil, so the declared intent would be silently no-opped.
        #
        # Production mutual TLS enforcement is NOT configured here. It is
        # provided by:
        #   1. The Helm chart, which mounts the apiserver client-CA bundle and
        #      passes --client-ca-path to the webhook, AND
        #   2. The --require-client-cert=true default on the webhook binary, which
        #      fails CLOSED at startup if no client-CA bundle is supplied.
        #
        # To enable mTLS in a non-Helm deployment, set client_ca_path to the
        # mounted apiserver CA bundle path and pass --client-ca-path accordingly.
        # See deployments/kubernetes/helm/ and cmd/admission-webhook/main.go.
        # (NET-WU-24: base manifest made consistent with what it actually provisions)
        client_auth: "none"
      # This base/example manifest ships the policy-manager management API with
      # authentication DISABLED (dev only; tracked gap). It is NOT production
      # secure. The production path is the Helm chart with auth.enabled=true,
      # which enforces OIDC bearer-token auth and REFUSES TO RENDER without an
      # issuer, jwksUrl, and audience.
      authentication:
        enabled: false
      rbac:
        default_role: "viewer"
      # NOTE: no security.encryption stanza — at-rest protection is a cluster
      # EncryptionConfiguration + KMS concern, not an in-app control (CRY-WU-15;
      # see deployments/kubernetes/encryption/ and docs/compliance/secrets-at-rest.md).

    storage:
      type: "memory"
      config: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-policies-validator
  labels:
    app: kube-policies
    component: admission-webhook
webhooks:
- name: validate.kube-policies.io
  clientConfig:
    service:
      name: kube-policies-admission-webhook
      namespace: kube-policies-system
      path: /validate
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods", "services", "configmaps", "secrets"]
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["apps"]
    apiVersions: ["v1"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["networking.k8s.io"]
    apiVersions: ["v1"]
    resources: ["networkpolicies", "ingresses"]
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["rbac.authorization.k8s.io"]
    apiVersions: ["v1"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  namespaceSelector:
    matchExpressions:
    - key: name
      operator: NotIn
      values: ["kube-system", "kube-public", "kube-node-lease", "kube-policies-system"]
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kube-policies-mutator
  labels:
    app: kube-policies
    component: admission-webhook
webhooks:
- name: mutate.kube-policies.io
  clientConfig:
    service:
      name: kube-policies-admission-webhook
      namespace: kube-policies-system
      path: /mutate
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["apps"]
    apiVersions: ["v1"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  namespaceSelector:
    matchExpressions:
    - key: name
      operator: NotIn
      values: ["kube-system", "kube-public", "kube-node-lease", "kube-policies-system"]
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 10
