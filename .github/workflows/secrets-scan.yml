# SDL-WU-19 / VUL-WU-07: Secret scanning via gitleaks.
# Compliance references: NIST IA-5 (Authenticator Management), SI-7 (Software,
# Firmware, and Information Integrity), SSDF PW.4 (Review and/or Analyze Human-
# Readable Code to Identify Vulnerabilities and Verify Compliance with Security
# Requirements). Scans full git history and working tree; any confirmed finding
# fails the job (non-zero exit).

name: Secret Scanning (gitleaks)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  schedule:
    # Weekly scan at 03:00 UTC on Monday — catches new gitleaks rules against
    # accumulated history without waiting for a PR.
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: Gitleaks — secret scan (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code (full history)
      # Full history is required so gitleaks --log-opts covers all commits, not
      # just HEAD. fetch-depth: 0 fetches every ref.
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    - name: Install gitleaks (pinned, checksum-verified against upstream checksums)
      # Mirror the amtool/promtool pattern used in ci.yml: download the release
      # tarball AND the upstream checksums.txt, then verify with sha256sum -c.
      # No hardcoded hash is embedded here; the upstream checksums file is the
      # authoritative source. The GITLEAKS_VERSION env var pins the release.
      # HUMAN CONFIRMATION REQUIRED: verify that GITLEAKS_VERSION and the
      # upstream checksums.txt at
      #   https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/checksums.txt
      # are current and trustworthy before merging.
      run: |
        set -euo pipefail
        asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        curl -fsSL -o "${asset}" "${base}/${asset}"
        # gitleaks 8.30.x names the checksums asset gitleaks_<ver>_checksums.txt
        # (older releases used a bare checksums.txt).
        curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        grep "  ${asset}$" checksums.txt | sha256sum -c -
        tar -xzf "${asset}" gitleaks
        sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Run gitleaks detect (full history + working tree)
      # --config .gitleaks.toml: use the committed config (extends default ruleset,
      #   carries justified allowlist entries for test-generated material).
      # --source .: scan the checked-out working tree.
      # --log-opts "--all": walk every commit reachable from any ref so historical
      #   secrets in non-default branches are caught.
      # --redact: mask secret values in CI log output.
      # --verbose: emit per-finding detail to aid triage.
      # Exit code is non-zero on any finding — the job fails.
      run: |
        set -euo pipefail
        gitleaks detect \
          --config .gitleaks.toml \
          --source . \
          --log-opts "--all" \
          --redact \
          --verbose
