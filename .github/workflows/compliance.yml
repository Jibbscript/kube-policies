name: Compliance

# Offline validation of the docs/compliance artifacts (control matrix, POA&M,
# inventory <-> boundary consistency, and relative markdown links). Additive
# and self-contained: requires only Python (no Helm/kube toolchain).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-compliance:
    name: Validate compliance artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.x"

      - name: Validate compliance artifacts
        run: make validate-compliance
