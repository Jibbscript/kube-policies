name: Compliance

# Offline validation of the docs/compliance artifacts (control matrix, POA&M,
# inventory <-> boundary consistency, and relative markdown links). Additive
# and self-contained: requires only Python (no Helm/kube toolchain).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-compliance:
    name: Validate compliance artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"

      - name: Validate compliance artifacts
        run: make validate-compliance
