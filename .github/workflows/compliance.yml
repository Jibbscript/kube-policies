name: Compliance

# Offline validation of the docs/compliance artifacts (control matrix, POA&M,
# inventory <-> boundary consistency, and relative markdown links). Additive
# and self-contained: requires only Python (no Helm/kube toolchain).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-compliance:
    name: Validate compliance artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate compliance artifacts
        run: make validate-compliance
