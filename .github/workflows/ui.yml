name: UI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'cmd/dashboard/**'
      - 'internal/policymanager/test_handler*.go'
      - 'internal/policy/evaluator_for_policy*.go'
      - 'internal/policy/bundled_defaults_test.go'
      - 'examples/policies/security-baseline.yaml'
      - 'Makefile'
      - 'build/Dockerfile.dashboard'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'cmd/dashboard/**'
      - 'internal/policymanager/test_handler*.go'
      - 'internal/policy/evaluator_for_policy*.go'
      - 'internal/policy/bundled_defaults_test.go'
      - 'examples/policies/security-baseline.yaml'
      - 'Makefile'
      - 'build/Dockerfile.dashboard'
      - '.github/workflows/ui.yml'

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

permissions:
  contents: read

# Cancel superseded runs so rapid pushes don't stack up long-running UI jobs.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Lint, Test, and Build UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # VUL-WU-06 (NIST RA-5, SI-2, SP 800-190): gate the SHIPPED (production)
      # dependency tree on HIGH/CRITICAL advisories — this is the runtime attack
      # surface of the Svelte SPA + BFF. Dev-only build/test tooling advisories
      # (vitest, esbuild, …) are surfaced informationally below and remediated
      # via Dependabot per docs/security/vulnerability-management.md, rather than
      # blocking the build on tools that never ship.
      - name: Dependency audit (pnpm — production deps gate)
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - name: Dependency audit (full tree — informational)
        working-directory: web
        run: pnpm audit --audit-level=high || true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: UI lint
        run: make ui-lint

      - name: UI test (JS/Vitest)
        run: make ui-test-js

      - name: UI test (Rego bundled defaults)
        run: make ui-test-rego

      - name: UI build
        run: make ui-build

      - name: Bundle size report
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p .omc/research
          SIZE=$(du -sb web/dist 2>/dev/null | cut -f1 || echo "0")
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"bytes":%s,"timestamp":"%s","ref":"%s"}\n' "$SIZE" "$TIMESTAMP" "$GIT_SHA" \
            | tee .omc/research/bundle-size-m1.json
          echo "Bundle size: ${SIZE} bytes"
          du -sh web/dist/* 2>/dev/null | sort -rh | head -20 || true

      - name: Upload bundle size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bundle-size-report
          path: .omc/research/bundle-size-m1.json

      - name: Build dashboard binary (with UI)
        run: WITH_UI=1 make build-dashboard

      - name: Helm lint
        run: |
          ./scripts/ci/helm-deps.sh
          helm lint charts/kube-policies

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dashboard-dist
          path: dist/dashboard-*
          retention-days: 7
