# helm/chart-testing (ct) configuration — used by the helm-tests job in ci.yml.
target-branch: main
chart-dirs:
  - charts
# Subchart dependency repos so `ct` can resolve/build the prometheus + grafana
# dependencies (their .tgz are gitignored) for both lint and install.
chart-repos:
  - prometheus-community=https://prometheus-community.github.io/helm-charts
  - grafana=https://grafana.github.io/helm-charts
# NOTE: do NOT set `helm-extra-args` here — ct applies the shared config to BOTH
# `ct lint` and `ct install`, and `helm lint` rejects `--timeout` ("unknown flag").
# The install timeout is passed to `ct install` on the command line instead.
validate-maintainers: false
check-version-increment: true
# Chart.yaml schema for lint validation (ct cannot find a default one in the
# pinned binary install). See .github/chart_schema.yaml.
chart-yaml-schema: .github/chart_schema.yaml
# yamllint config for `ct lint` (also not found by default in the binary install).
lint-conf: .github/lintconf.yaml
