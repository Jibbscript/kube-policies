# Kube-Policies TLS certificate-expiry alerts (CRY-WU-12, NIST SC-12/SC-17/SI-4).
# Loaded via prometheus.yaml rule_files (/etc/prometheus/rules/*.yml). The metric
# kube_policies_tls_cert_expiry_seconds is the served cert's expiry (Unix
# seconds), published per component by each TLS server on every hot reload.
groups:
  - name: kube-policies-tls
    rules:
      - alert: KubePoliciesCertExpiringSoon
        # Fires while the served cert has < 7 days of validity left.
        expr: (kube_policies_tls_cert_expiry_seconds - time()) < (7 * 24 * 3600)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "kube-policies {{ $labels.component }} TLS certificate expires in under 7 days"
          description: "The serving certificate for {{ $labels.component }} expires soon. Rotate it (cert-manager renews automatically; for the demo/self-signed path, regenerate the Secret)."
          runbook_url: "https://github.com/Jibbscript/kube-policies/blob/main/docs/runbooks/cert-rotation.md"

      - alert: KubePoliciesCertExpired
        # Fires once the served cert is past its NotAfter.
        expr: (kube_policies_tls_cert_expiry_seconds - time()) <= 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "kube-policies {{ $labels.component }} TLS certificate has EXPIRED"
          description: "The serving certificate for {{ $labels.component }} is expired; TLS handshakes (and, for the webhook, admission) will fail. Rotate immediately."
          runbook_url: "https://github.com/Jibbscript/kube-policies/blob/main/docs/runbooks/cert-rotation.md"
