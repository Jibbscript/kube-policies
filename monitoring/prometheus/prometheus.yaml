global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'kube-policies-cluster'
    environment: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Kube-Policies Admission Webhook
  #
  # Default (demo): metrics is plain HTTP. When the chart is deployed with
  # metrics.tls.enabled=true (CRY-WU-08), /metrics serves TLS 1.3 and requires a
  # bearer token. To scrape it, mount the serving CA + the internal token into
  # this Prometheus pod (cross-namespace: copy the <release>-internal-token and
  # serving-cert Secrets into this namespace) and add:
  #     scheme: https
  #     tls_config:
  #       ca_file: /etc/prometheus/kp-tls/ca.crt
  #       server_name: kube-policies-admission-webhook.kube-policies-system.svc
  #     bearer_token_file: /etc/prometheus/kp-token/token
  - job_name: 'kube-policies-admission-webhook'
    static_configs:
      - targets: ['kube-policies-admission-webhook:9090']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Kube-Policies Policy Manager
  # See the admission-webhook job above for the metrics.tls.enabled=true
  # (https + ca_file + bearer_token_file) scrape shape; server_name is then
  # kube-policies-policy-manager.kube-policies-system.svc.
  - job_name: 'kube-policies-policy-manager'
    static_configs:
      - targets: ['kube-policies-policy-manager:9091']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Kube-Policies Dashboard (:9092)
  #
  # No scrape job is defined here today — the dashboard /metrics endpoint is not
  # currently scraped by this demo Prometheus config. When you DO add one, the
  # dashboard mirrors the webhook/policy-manager metrics posture (IAM-WU-12):
  # plain HTTP + unauthenticated by default, and TLS 1.3 + bearer-token auth when
  # the chart is deployed with dashboard.tls.enabled=true. To scrape the
  # TLS-protected dashboard metrics, use the same shape as the admission-webhook
  # job above (scheme: https + tls_config.ca_file + bearer_token_file pointing at
  # the mounted serving CA and the <release>-internal-token Secret), with
  # server_name kube-policies-dashboard.kube-policies-system.svc and target
  # kube-policies-dashboard:9092.

  # Kubernetes API Server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - default
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # Kubernetes Nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # Kubernetes Pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # Kubernetes Services
  - job_name: 'kubernetes-services'
    kubernetes_sd_configs:
      - role: service
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
        action: keep
        regex: true
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter.example.com:9115
      - source_labels: [__param_target]
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: kubernetes_name

  # cAdvisor for container metrics
  - job_name: 'kubernetes-cadvisor'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  # Node Exporter
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoints_name]
        regex: 'node-exporter'
        action: keep
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name

  # Kube State Metrics
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']
    honor_labels: true
    scrape_interval: 30s
    scrape_timeout: 10s
